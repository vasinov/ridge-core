site_name: Ridge
site_description: A resource mesh for AI agents — delegate access, coordinate work, retrieve results
site_url: https://vasinov.github.io/ridge-core/
repo_url: https://github.com/vasinov/ridge-core
repo_name: vasinov/ridge-core

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            members: true
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

nav:
  - Overview: index.md
  - First local workflow: getting-started.md
  - Configuration: configuration.md
  - Integrations: integrations.md
  - Delegating work: guides/delegation.md
  - Examples:
      - Overview: examples/index.md
      - Delegated task handoff: examples/delegation.md
      - Sales report: examples/csv-report.md
  - Frontends:
      - CLI: cli.md
      - MCP: mcp.md
  - Resources:
      - Local: resources/local.md
      - Docker: resources/docker.md
      - SSH: resources/ssh.md
      - S3: resources/s3.md
  - Guides:
      - Resource coordination: guides/coordination.md
      - Copying between resources: guides/copying.md
      - Background jobs: guides/jobs.md
  - Concepts:
      - Resources and capabilities: concepts/resources.md
      - Authorization: concepts/authorization.md
  - Resource providers: providers.md
  - Architecture: architecture.md
  - Python API: python-api.md
  - Security model: security.md
  - Development: development.md
