# Workspace configuration: resource inventory, policy, and managed state.
# Check it with: ridge --config ridge.example.yaml config validate
# Validation checks the loader, not backend connectivity or safe state placement.
# Optional; defaults to .ridge beside this YAML file. Keep durable state outside
# resource trees that agents might copy, replace, or delete. This example uses root: .,
# so it places state in a sibling directory. Choose a project-specific location;
# inventories coordinate only when they share this directory and matching keys.
state:
  directory: ../.ridge-example-state

resources:
  local:
    provider: local
    root: .
    lock_key: project-workspace

  project-files:
    provider: local
    root: .
    # These resources alias the same root, so they must share a coordination key.
    lock_key: project-workspace
    properties:
      purpose: source-code

  # Docker resources need an existing running container with Python 3.11+.
  # build:
  #   provider: docker
  #   container: ridge-build
  #   root: /workspace
  #   python: python3

  # SSH resources use ambient OpenSSH configuration and credentials.
  # build-host:
  #   provider: ssh
  #   host: build.example.com
  #   user: ridge
  #   root: /srv/ridge/workspace
  #   python: python3

  # S3 resources use Boto3's ambient credential chain.
  # artifacts:
  #   provider: s3
  #   bucket: example-artifacts
  #   prefix: ridge/runs
  #   region: us-west-2

# Omit permissions for unrestricted trusted mode. When present, the map is
# default-deny and grants only the exact operations listed for each resource.
# Add data.delete only where explicit cleanup is intended; recursion is a request
# option, not a separate grant. Unrestricted mode includes deletion on built-ins.
# permissions:
#   project-files:
#     - data.list
#     - data.read
#     - data.stat

# Delegation is independently default-deny, even with unrestricted permissions.
# Effective delegability also requires the operation to be permitted above.
# This prepares policy only; scope-bound CLI/MCP workflows are not available yet.
# delegation:
#   project-files:
#     - data.read
#     - data.stat
