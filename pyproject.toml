[project]
name = "ridge-core"
version = "0.1.0"
description = "A resource abstraction layer for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.43.0,<2",
    "mcp>=2.1,<3",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0.2",
    "typer>=0.27.2",
]

[project.urls]
Documentation = "https://vasinov.github.io/ridge-core/"
Issues = "https://github.com/vasinov/ridge-core/issues"
Repository = "https://github.com/vasinov/ridge-core"

[project.scripts]
ridge = "ridge.cli:main"
ridge-mcp = "ridge.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
